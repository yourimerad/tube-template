# Shared site config, included in the HTTP-only or the HTTPS server block by site-entrypoint.sh.
# auth.conf / robots.conf are rendered at start from PRIVATE.
include /etc/nginx/site/auth.conf;

location ^~ /.well-known/acme-challenge/ {
    auth_basic off;
    root /var/www/certbot;
    default_type text/plain;
}

location = /healthz {
    auth_basic off;
    access_log off;
    include /etc/nginx/site/proxy.conf;
    proxy_pass http://app;
}

location ~ /\. { deny all; }

# Media straight from disk: long immutable cache, byte ranges (built in), CORS for hls.js.
location ^~ /media/ {
    alias /srv/media/;
    location = /media/catalog.json { return 404; }
    types {
        application/vnd.apple.mpegurl m3u8;
        video/iso.segment             m4s;
        video/mp4                     mp4 m4v;
        image/webp                    webp;
        image/jpeg                    jpg jpeg;
    }
    default_type application/octet-stream;
    if ($request_method = OPTIONS) { return 204; }
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
    add_header X-Content-Type-Options "nosniff" always;
    include /etc/nginx/site/robots.conf;
}

# Fingerprinted static assets (?v=<hash>) from the app directory.
location ^~ /static/ {
    alias /srv/static/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    include /etc/nginx/site/robots.conf;
}

# Votes, comments, views: never cached, JSON.
location ^~ /api/ {
    limit_req zone=api burst=30 nodelay;
    proxy_cache off;
    include /etc/nginx/site/proxy.conf;
    proxy_pass http://app;
}

# Anonymous HTML pages: micro-cached, keyed WITHOUT cookies (cookies are not even forwarded).
location / {
    limit_req zone=pagereq burst=60 nodelay;
    include /etc/nginx/site/proxy.conf;
    proxy_set_header Cookie "";
    proxy_cache pages;
    proxy_cache_key "$scheme$host$request_uri";
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 30s;
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    add_header X-Cache $upstream_cache_status always;
    proxy_pass http://app;
}
