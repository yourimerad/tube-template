user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;
error_log  /dev/stderr warn;
pid        /run/nginx.pid;

events {
    worker_connections  8192;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # Access log without client IPs (privacy: IPs are only ever stored as salted hashes by the app).
    log_format site '$time_iso8601 "$request" $status $body_bytes_sent $request_time cache=$upstream_cache_status';
    access_log /dev/stdout site buffer=32k flush=5s;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    client_max_body_size 64k;
    open_file_cache max=20000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_errors on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/xml
               image/svg+xml application/vnd.apple.mpegurl;

    # Anonymous HTML micro-cache (30 s, set by the app via X-Accel-Expires).
    proxy_cache_path /var/cache/nginx/pages levels=1:2 keys_zone=pages:20m max_size=512m inactive=10m use_temp_path=off;

    limit_req_zone $binary_remote_addr zone=api:10m   rate=10r/s;
    limit_req_zone $binary_remote_addr zone=pagereq:10m rate=30r/s;
    limit_req_status 429;

    upstream app {
        server app:3000;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
